spring.application.name=api-gateway

server.port=8080

# Enable automatic service discovery routes
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


# Route 1: Book Service
spring.cloud.gateway.server.webflux.routes[0].id=book-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://bookservice
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/books/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0


# Route 2: Order Service
spring.cloud.gateway.server.webflux.routes[1].id=order-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://orderservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0


# Eureka connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Swagger Routes
# Book Service Swagger
spring.cloud.gateway.server.webflux.routes[2].id=book-service-docs
spring.cloud.gateway.server.webflux.routes[2].uri=lb://bookservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/bookservice/v3/api-docs


# Order Service Swagger
spring.cloud.gateway.server.webflux.routes[3].id=order-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=lb://orderservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/orderservice/v3/api-docs


# Swagger UI Configuration

springdoc.swagger-ui.path=/swagger

springdoc.swagger-ui.urls[0].name=Book-Service
springdoc.swagger-ui.urls[0].url=/bookservice/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order-Service
springdoc.swagger-ui.urls[1].url=/orderservice/v3/api-docs